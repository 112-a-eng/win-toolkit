name: Build EXE

# 注意：所有 run: 内联脚本刻意只用 ASCII 字符（文件名用通配符获取，不写中文字面量）。
# 原因：GitHub Actions 把内联脚本写成无 BOM 的临时 .ps1，Windows PowerShell 5.1 会按系统
#      ANSI 代码页读取它，内联中文会变乱码并报 TerminatorExpectedAtEndOfString。
#      仓库里的正式脚本（build-exe.ps1 等）都带 UTF-8 BOM，不受此影响。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-exe:
    name: Build single-file EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Environment self-check
        shell: powershell
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host "=== PowerShell ==="
          $PSVersionTable.PSVersion.ToString()
          Write-Host "=== csc.exe ==="
          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          Write-Host ("present: " + (Test-Path $csc))
          Write-Host "=== repository files ==="
          Get-ChildItem -Recurse -File | Where-Object { $_.Extension -in '.ps1', '.bat', '.exe', '.cs', '.ico' } |
            Sort-Object FullName | ForEach-Object {
              Write-Host ("  {0,10} bytes  {1}" -f $_.Length, $_.FullName.Substring($PWD.Path.Length + 1))
            }
          Write-Host "=== UTF-8 BOM check on every .ps1 ==="
          $bad = 0
          $total = 0
          foreach ($f in (Get-ChildItem -Recurse -File -Filter *.ps1)) {
            $total++
            $b = [System.IO.File]::ReadAllBytes($f.FullName)
            $bom = ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF)
            if (-not $bom) { $bad++; Write-Host ("  MISSING BOM -> " + $f.Name) }
          }
          Write-Host ("ps1 total: $total , without BOM: $bad")
          if ($bad -gt 0) { throw "some .ps1 files lost their UTF-8 BOM" }

      - name: Build EXE
        shell: powershell
        run: ./build/build-exe.ps1

      - name: Make ASCII-named copy and checksum
        shell: powershell
        run: |
          $exe = Get-ChildItem -File -Filter *.exe | Select-Object -First 1
          Write-Host ("built: " + $exe.Name + "  " + $exe.Length + " bytes")
          Copy-Item $exe.FullName 'win-toolkit.exe' -Force
          $hash = (Get-FileHash 'win-toolkit.exe' -Algorithm SHA256).Hash
          "$hash  win-toolkit.exe" | Set-Content -Path 'SHA256SUMS.txt' -Encoding ascii
          Write-Host ("SHA256: " + $hash)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-toolkit-exe
          path: |
            win-toolkit.exe
            SHA256SUMS.txt

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            win-toolkit.exe
            SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## Windows Command Toolkit ${{ github.ref_name }}

            Portable single-file build - download `win-toolkit.exe` and double-click. No installer, no execution-policy change needed.

            - All scripts and the icon are embedded; it runs from any folder
            - Placed next to `scripts/`, it uses those local scripts instead
            - Verify your download with `SHA256SUMS.txt`
            - Also installable via winget: `winget install 112-a-eng.WinToolkit`
